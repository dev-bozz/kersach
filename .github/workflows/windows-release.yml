name: Windows x64 build and release artifact
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CalculatorPatterns.sln
      - run: dotnet build CalculatorPatterns.sln -c Release --no-restore
      - run: dotnet test CalculatorPatterns.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - run: dotnet publish src/CalculatorPatterns.Desktop/CalculatorPatterns.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CalculatorPatterns-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
